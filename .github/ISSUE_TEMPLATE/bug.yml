name: Bug report
description: Report a reproducible problem in Tart Launchpad.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private keys, personal data, or sensitive VM archives. For a security issue, use the private reporting path in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest useful set of steps and any safe-to-share command output.
      placeholder: |
        1. Run ...
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share only non-sensitive details, such as macOS, Tart, and Launchpad versions.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
